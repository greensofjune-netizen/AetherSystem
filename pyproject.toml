[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-engine"
version = "0.1.0"
description = "A local-first CLI for project tasks and event history."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
aether-engine = "aether_engine.cli:main"
aether-server = "aether_engine.server:main"
aether-historian-behavior = "aether_engine.historian_behavior:main"

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "mypy>=1.15.0", "pytest>=7.0.0", "ruff>=0.11.0"]
build = ["pyinstaller>=6.22.0"]
local-ai = ["llama-cpp-python>=0.3.0"]
api = ["fastapi>=0.115.0", "pydantic>=2.8.0", "uvicorn>=0.30.0"]
behavioral-demo = ["torch>=2.2.0"]
ollama = ["ollama>=0.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["backup_replication.py", "src/aether_engine"]
check_untyped_defs = true
warn_unused_ignores = true
