[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-engine"
version = "0.1.0"
description = "A local-first CLI for project tasks and event history."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
aether-engine = "aether_engine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
