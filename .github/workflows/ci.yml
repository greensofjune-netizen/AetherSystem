name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
      - if: runner.os == 'Linux'
        run: cc -std=c11 -Wall -Wextra -Werror -shared -fPIC src/aether_bridge.c -o /tmp/libaether.so
      - if: runner.os == 'macOS'
        run: clang -std=c11 -Wall -Wextra -Werror -dynamiclib -fPIC src/aether_bridge.c -o /tmp/libaether.dylib
      - run: python -m pip install -e ".[dev,api,ollama,secure-vault,spin-network-visualization]"
      - run: ruff check .
      - run: mypy
      - run: npm exec --yes --package=typescript@5.9.3 -- tsc --noEmit --strict --target ES2020 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions tests/test_validation_types.ts
      - run: node --test tests/test_validation_frontend.mjs
      - run: node tests/test_validation_types.ts
      - run: python -m pytest
