name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Linux SSH test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
      - name: Compile C bridge on Linux
        if: runner.os == 'Linux'
        run: cc -std=c11 -Wall -Wextra -Werror -shared -fPIC src/aether_bridge.c -o /tmp/libaether.so
      - name: Compile C bridge on macOS
        if: runner.os == 'macOS'
        run: clang -std=c11 -Wall -Wextra -Werror -dynamiclib -fPIC src/aether_bridge.c -o /tmp/libaether.dylib
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,api,ollama,secure-vault,spin-network-visualization]"
      - name: Install Chromium for monitor readiness
        run: python -m playwright install --with-deps chromium
      - name: Lint Python
        run: ruff check .
      - name: Type-check Python
        run: mypy
      - name: Type-check validation contract
        run: npm exec --yes --package=typescript@5.9.3 -- tsc --noEmit --strict --target ES2020 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions tests/test_validation_types.ts
      - name: Test frontend validation
        run: node --test tests/test_validation_frontend.mjs
      - name: Test TypeScript validation
        run: node tests/test_validation_types.ts
      - name: Run Python test suite
        run: python -m pytest
